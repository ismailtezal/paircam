[workspace]
resolver = "3"
members = ["apps/desktop", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ismailtezal/paircam"

[workspace.dependencies]
gpui-kit = "0.9.1"
anyhow = "1"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
