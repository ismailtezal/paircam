[package]
name = "paircam-desktop"
description = "PairCam desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "paircam"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel = "2"
gpui-kit.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
paircam-engine = { path = "../../crates/engine" }
paircam-ui = { path = "../../crates/ui" }
raw-window-handle = "0.6"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple_logger = { version = "5", default-features = false, features = ["stderr"] }
smallvec = "1"
sys-locale = "0.3"
tray-icon = "0.26"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# The Windows icon and version resource (build.rs).
embed-resource = "3"

[lints]
workspace = true
