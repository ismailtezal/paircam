[package]
name = "paircam-desktop"
description = "PairCam desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "paircam"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
image = { version = "0.25", default-features = false }
log = "0.4"
paircam-engine = { path = "../../crates/engine" }
paircam-ui = { path = "../../crates/ui" }
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple_logger = { version = "5", default-features = false, features = ["stderr"] }
smallvec = "1"
sys-locale = "0.3"

[lints]
workspace = true
