[package]
name = "paircam-protocol"
description = "The PairCam phone-to-desktop protocol: records, handshake, secure channel and messages"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = "1"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
hex = "0.4"

[lints]
workspace = true
