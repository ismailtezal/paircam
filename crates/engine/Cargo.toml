[package]
name = "paircam-engine"
description = "The PairCam desktop engine: discovery, pairing, receiving, decoding and the camera feed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
async-channel = "2"
bytes = "1"
log = "0.4"
paircam-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_NetworkManagement_Dns",
    "Win32_Networking_WinSock",
    # The virtual camera: its pipe server, registration and installation check.
    "Win32_Media_MediaFoundation",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    # The away screen: finding a face in the picture, and drawing its message.
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_FaceAnalysis",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
cc = "1"

[dev-dependencies]
# The `looks` example reads still pictures and writes contact sheets, as do the away screen
# checks.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
simple_logger = { version = "5", default-features = false, features = ["stderr"] }

[lints]
workspace = true
